name: NBA Prediction Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Install fixture-test dependencies
        run: pip install -r requirements.txt pytest
      - name: Check autoresearch paths
        run: |
          python -c "import autorun; assert autorun.REPO_ROOT == __import__('pathlib').Path.cwd().resolve()"
      - name: Model correctness and odds collector tests
        run: python -m pytest tests -q
